<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pinboard</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/grid.css" />
  <link rel="stylesheet" href="css/modal.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/search.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Pinboard</a>
    <span class="board-tools">
      <button type="button" id="undoBtn" class="icon-btn" aria-label="Undo" title="Undo (Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M12.5 8c-2.6 0-5 1-6.7 2.7L3 7v9h9l-3.2-3.2c1.7-1.7 4-2.7 6.7-2.7 4.7 0 8.5 3.8 8.5 8.5S17.2 27 12.5 27c-2.3 0-4.5-.9-6.2-2.5l-1.4 1.4C7 28 9.7 29 12.5 29c5.8 0 10.5-4.7 10.5-10.5S18.3 8 12.5 8z"/>
        </svg>
      </button>
      <button type="button" id="redoBtn" class="icon-btn" aria-label="Redo" title="Redo (Ctrl+Y)" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M11.5 8c2.6 0 5 1 6.7 2.7L21 7v9h-9l3.2-3.2c-1.7-1.7-4-2.7-6.7-2.7-4.7 0-8.5 3.8-8.5 8.5S5.8 27 10.5 27c2.3 0 4.5-.9 6.2-2.5l1.4 1.4C16 28 13.3 29 10.5 29c-5.8 0-10.5-4.7-10.5-10.5S4.7 8 10.5 8z"/>
        </svg>
      </button>
      <input type="text" id="boardTitle" class="board-title" placeholder="Board title" maxlength="80" />
      <button type="button" id="saveBoard" class="icon-btn" aria-label="Save board to library" title="Save board to library">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm0 2v12h7V5H5Zm9 0v3h3l-3-3Zm-7 9h7v2H7v-2Zm0-4h7v2H7v-2Z"/>
        </svg>
      </button>
    </span>
    <span class="hint">Drag to pan &middot; drag a pin to another cell &middot; click an empty cell to add a note, image, or paste from clipboard &middot; right-click a pin to resize it</span>
    <a class="topbar-link" href="library.html">Library</a>
  </header>

  <main class="viewport" id="viewport">
    <div class="world" id="world"></div>
    <div class="empty-hint" id="emptyHint" hidden>
      <p>Hover a cell to add a note, image, or paste</p>
    </div>
    <div class="cell-add" id="cellAdd" hidden>
      <div class="cell-add-row">
        <button type="button" data-type="note">+ Note</button>
        <button type="button" data-type="image">+ Image</button>
        <button type="button" data-type="paste">Paste</button>
      </div>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
