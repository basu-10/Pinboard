<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pinboard</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/grid.css" />
  <link rel="stylesheet" href="css/modal.css" />
  <link rel="stylesheet" href="css/nav.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">Pinboard</span>
    <span class="board-tools">
      <input type="text" id="boardTitle" class="board-title" placeholder="Board title" maxlength="80" />
      <button type="button" id="saveBoard" class="icon-btn" aria-label="Save board to library" title="Save board to library">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm0 2v12h7V5H5Zm9 0v3h3l-3-3Zm-7 9h7v2H7v-2Zm0-4h7v2H7v-2Z"/>
        </svg>
      </button>
    </span>
    <span class="hint">Drag to pan &middot; drag a card to another cell &middot; click an empty cell to add a note, image, or paste from clipboard &middot; right-click a card to resize it</span>
    <a class="topbar-link" href="library.html">Library</a>
  </header>

  <main class="viewport" id="viewport">
    <div class="world" id="world"></div>
    <div class="cell-add" id="cellAdd" hidden>
      <div class="cell-add-row">
        <button type="button" data-type="note">+ Note</button>
        <button type="button" data-type="image">+ Image</button>
        <button type="button" data-type="paste">Paste</button>
      </div>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
