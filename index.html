<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Wall</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/grid.css" />
  <link rel="stylesheet" href="css/modal.css" />
  <link rel="stylesheet" href="css/nav.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">Text&nbsp;Wall</span>
    <span class="hint">Drag to pan &middot; drag a card to another cell &middot; click an empty cell to add a note or image &middot; right-click a card to resize it</span>
  </header>

  <main class="viewport" id="viewport">
    <div class="world" id="world"></div>
    <div class="cell-add" id="cellAdd" hidden>
      <button type="button" data-type="note">+ Note</button>
      <button type="button" data-type="image">+ Image</button>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
