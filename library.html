<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library — Pinboard</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body class="page-library">
  <header class="site-head">
    <a class="brand" href="index.html">Pinboard</a>
    <span class="site-head-title">Library</span>
    <span class="site-head-spacer"></span>
    <button type="button" id="importBtn" class="topbar-link" title="Import a board backup (JSON)">Import backup</button>
    <a class="topbar-link" href="app.html">+ New board</a>
    <input type="file" id="importFile" accept="application/json,.json" hidden />
  </header>

  <main class="library">
    <div class="library-grid" id="libraryGrid"></div>
    <p class="library-empty" id="libraryEmpty" hidden>
      No boards yet. Open the wall, build something, then hit the save icon.
    </p>
  </main>

  <script type="module" src="js/library.js"></script>
</body>
</html>
